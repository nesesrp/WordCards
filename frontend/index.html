<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordCards</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before the first paint (see js/theme.js).
    try {
      const theme = localStorage.getItem('wordcards:theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo">🗂️ <span class="logo-text">WordCards</span></a>
    <nav>
      <a href="#/" data-nav="home">Ana sayfa</a>
      <a href="#/decks" data-nav="decks">Desteler</a>
      <a href="#/library" data-nav="library">Hazır</a>
      <a href="#/stats" data-nav="stats">İlerleme</a>
      <span class="streak" id="streak" title="Günlük seri"></span>
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
    </nav>
  </header>
  <main id="app" class="container"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
